# [TINIX] Kiểm tra tự động cho mỗi PR vào main và mỗi lần push lên main/tinix.
# Chạy trên Windows vì app này phát triển/dùng trên Windows (font, đường dẫn, better-sqlite3/sharp).
# Các bước khớp CLAUDE.md ("ba cổng trước khi commit") cộng kiểm tra kiểu service và bộ kiểm thử offline.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, tinix]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            service/package-lock.json

      - name: Cài phụ thuộc (frontend + service)
        run: |
          npm ci
          npm --prefix service ci

      - name: Lint
        run: npm run lint

      - name: Kiểm tra kiểu frontend (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Kiểm tra kiểu service
        run: npm run tinix:typecheck-service

      - name: Build frontend
        run: npx vite build

      - name: Cài Chromium cho Puppeteer (bài test khớp font và mặt nạ cần trình duyệt)
        run: npm --prefix service exec -- puppeteer browsers install chrome

      - name: Kiểm thử offline
        run: npm run tinix:test
