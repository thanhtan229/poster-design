# [TINIX] Run source QA and the synthetic ghost regressions on the stacked P2 PR.
name: Scrapbook source QA

on:
  pull_request:
    branches: [main, codex/scrapbook-p1, codex/scrapbook-p2, codex/scrapbook-p3, codex/scrapbook-p4-preflight, codex/scrapbook-p4-a2] # [TINIX]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PNG and numerical tools
        run: pip install pillow numpy scipy opencv-python-headless
      - name: Run source and ghost regressions
        run: |
          python -B scripts/tinix-mcp/workflow_compositions_test.py
          python -B scripts/tinix-mcp/source_qa_test.py > source-qa.log 2>&1 || (tail -100 source-qa.log && exit 1)
          grep -E '^Ran [[:digit:]]+ tests|^OK$' source-qa.log
      - name: Verify all four Mixed Handcut demos
        env:
          TINIX_MIXED_HANDCUT_EVIDENCE: mixed-handcut-evidence
        run: python -B scripts/tinix-mcp/mixed_handcut_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-handcut-fixture
          path: mixed-handcut-evidence/
          if-no-files-found: error

  # [TINIX] Exercises discovery and the operation journal without private fixtures.
  orchestrator-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            service/package-lock.json
            scripts/tinix-mcp/package-lock.json
      - run: npm ci --prefix service
      - run: npm ci --prefix scripts/tinix-mcp
      - run: node --test scripts/tinix-mcp/orchestrator-contract.test.mjs
