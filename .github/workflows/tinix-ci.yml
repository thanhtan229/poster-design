# [TINIX] Run the same checks on pull requests and on updates to main.
name: TinixPoster CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tinix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            service/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
      - name: Install service dependencies and Chromium
        run: npm ci --prefix service
      - name: Lint
        run: npm run lint
      - name: Typecheck frontend
        run: npx --no-install vue-tsc --noEmit
      - name: Typecheck service
        run: npm run tinix:typecheck-service
      - name: Build frontend
        run: npx --no-install vite build
      - name: Run TinixPoster tests
        run: npm run tinix:test
