# [TINIX] Run the same checks on pull requests and on updates to main.
name: TinixPoster CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tinix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Use the runner's Chrome, whose sandbox is supported on Ubuntu 24.04.
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            service/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
      - name: Install service dependencies
        run: npm ci --prefix service
      - name: Lint
        run: npm run lint
      - name: Typecheck frontend
        run: npx --no-install vue-tsc --noEmit
      - name: Typecheck service
        run: npm run tinix:typecheck-service
      - name: Build frontend
        run: npx --no-install vite build
      - name: Verify backup compression and failure handling
        run: node --test scripts/tinix-backup-archive.test.mjs scripts/tinix-backup-process.test.mjs
      - name: Run TinixPoster tests
        run: |
          "$PUPPETEER_EXECUTABLE_PATH" --version
          npm run tinix:test

  windows-backup:
    name: Windows system tar backup smoke
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # [TINIX] The Unicode branch uses the stdlib UTF-8/PAX reader on Windows.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci --prefix service
      - run: node --test scripts/tinix-backup-archive.test.mjs scripts/tinix-backup-process.test.mjs
